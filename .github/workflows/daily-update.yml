name: Galerie Paris Lisboa Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Collect dated exhibition metadata
        run: python scripts/update_exhibitions.py

      - name: Collect art news candidates and verify detail pages
        run: python scripts/collect_art_sources.py

      - name: Publish verified art news
        run: python scripts/update_art_news.py

      - name: Collect Agenda LX exhibitions and images
        run: python scripts/collect_agendalx.py

      - name: Save updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/generators/exhibitions.json
          git add data/generators/news_candidates.json
          git add data/generators/news.json
          git add data/generators/agendalx.json

          if ! git diff --cached --quiet; then
            git commit -m "Daily exhibition, Agenda LX and art news update"
            git push
          fi
