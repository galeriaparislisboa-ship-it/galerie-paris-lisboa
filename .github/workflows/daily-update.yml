name: Galerie Paris Lisboa Daily Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update status
        run: |
          mkdir -p data/generators
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              "project": "Galerie Paris Lisboa",
              "last_check": datetime.now(timezone.utc).isoformat(),
              "modules": [
                  "design-price-finder",
                  "architecture-studio-finder",
                  "portugal-exhibition-finder"
              ]
          }

          Path("data/generators/status.json").write_text(
              json.dumps(status, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Save update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generators/status.json
          git diff --cached --quiet || (
            git commit -m "Daily generator status update" &&
            git push
          )
