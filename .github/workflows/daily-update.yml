name: Galerie Paris Lisboa Daily Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect dated exhibition metadata
        run: python scripts/update_exhibitions.py

      - name: Save updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generators/exhibitions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update exhibition listings"
            git push
          fi
