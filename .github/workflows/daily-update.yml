name: Galerie Paris Lisboa Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Collect dated exhibition metadata
        run: python scripts/update_exhibitions.py

      - name: Collect art and design sources
        run: python scripts/collect_art_sources.py

      - name: Update art and design news
        run: python scripts/update_art_news.py

      - name: Save updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generators/exhibitions.json data/generators/news_candidates.json data/generators/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily exhibition and art news update"
            git push
          fi
